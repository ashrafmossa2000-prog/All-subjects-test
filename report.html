<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تشخيص تقرير الاختبار</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- LZString -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 25px;
        }

        .status {
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: 700;
            line-height: 1.8;
            word-break: break-word;
        }

        .success {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .error {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }

        .info {
            background: #eff6ff;
            border: 2px solid #3b82f6;
            color: #1e40af;
        }

        .warning {
            background: #fffbeb;
            border: 2px solid #f59e0b;
            color: #92400e;
        }

        .data-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
            max-height: 300px;
            overflow: auto;
            font-family: monospace;
            font-size: 13px;
        }

        .report {
            display: none;
        }

        .report-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border-right: 5px solid #667eea;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 700;
            color: #666;
        }

        .value {
            font-weight: 800;
            color: #222;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .row {
                flex-direction: column;
                gap: 3px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔍 تشخيص تقرير الاختبار</h1>

    <div id="diagnostics"></div>

    <div id="report" class="report">

        <h2 style="text-align:center;color:#667eea;">
            📋 بيانات التقرير
        </h2>

        <div class="report-card">

            <div class="row">
                <span class="label">👤 الطالب</span>
                <span class="value" id="student"></span>
            </div>

            <div class="row">
                <span class="label">📱 الهاتف</span>
                <span class="value" id="phone"></span>
            </div>

            <div class="row">
                <span class="label">📚 الصف</span>
                <span class="value" id="grade"></span>
            </div>

            <div class="row">
                <span class="label">📖 الوحدة</span>
                <span class="value" id="unit"></span>
            </div>

            <div class="row">
                <span class="label">📝 الدرس</span>
                <span class="value" id="lesson"></span>
            </div>

            <div class="row">
                <span class="label">🏆 الدرجة</span>
                <span class="value" id="score"></span>
            </div>

            <div class="row">
                <span class="label">📈 النسبة</span>
                <span class="value" id="percent"></span>
            </div>

            <div class="row">
                <span class="label">⏱️ الوقت</span>
                <span class="value" id="time"></span>
            </div>

            <div class="row">
                <span class="label">🕐 التاريخ</span>
                <span class="value" id="date"></span>
            </div>

        </div>

        <div id="wrongQuestions"></div>

    </div>

    <div class="footer">
        👨‍🏫 إعداد: المهندس / أشرف موسى<br>
        📞 01110547129 - 01100429783
    </div>

</div>


<script>

    // =========================================================
    // أدوات التشخيص
    // =========================================================

    const diagnostics =
        document.getElementById('diagnostics');


    function addStatus(type, title, message) {

        const div = document.createElement('div');

        div.className = 'status ' + type;

        div.innerHTML =
            '<strong>' + title + '</strong><br>' +
            message;

        diagnostics.appendChild(div);
    }


    function addDataBox(title, data) {

        const wrapper = document.createElement('div');

        wrapper.className = 'status info';

        wrapper.innerHTML =
            '<strong>' + title + '</strong>' +
            '<div class="data-box"></div>';

        wrapper.querySelector('.data-box').textContent =
            data;

        diagnostics.appendChild(wrapper);
    }


    // =========================================================
    // قراءة البيانات
    // =========================================================

    function diagnoseReport() {

        try {

            // -------------------------------------------------
            // 1. فحص URL
            // -------------------------------------------------

            const fullUrl = window.location.href;

            addStatus(
                'info',
                '1️⃣ الرابط الحالي',
                'تم قراءة الرابط من الصفحة.'
            );

            addDataBox(
                'الرابط الكامل:',
                fullUrl
            );


            // -------------------------------------------------
            // 2. فحص HASH
            // -------------------------------------------------

            const hash = window.location.hash;

            addStatus(
                'info',
                '2️⃣ فحص HASH',
                'طول HASH = ' + hash.length
            );

            addDataBox(
                'HASH:',
                hash
            );


            // -------------------------------------------------
            // 3. هل يوجد data= ؟
            // -------------------------------------------------

            if (!hash) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 1',
                    'window.location.hash فارغ تمامًا.'
                );

                return;
            }


            if (!hash.includes('data=')) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 2',
                    'الرابط وصل للصفحة، ولكن لا يوجد بداخله data='
                );

                return;
            }


            addStatus(
                'success',
                '✅ data= موجود',
                'تم العثور على بيانات التقرير داخل الرابط.'
            );


            // -------------------------------------------------
            // 4. استخراج البيانات
            // -------------------------------------------------

            const dataStart =
                hash.indexOf('data=') + 5;

            const encoded =
                hash.substring(dataStart);


            addStatus(
                'info',
                '3️⃣ البيانات المضغوطة',
                'طول البيانات = ' + encoded.length
            );


            if (!encoded) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 3',
                    'data= موجود ولكن البيانات بعده فارغة.'
                );

                return;
            }


            addDataBox(
                'بداية البيانات المضغوطة:',
                encoded.substring(0, 500) +
                (encoded.length > 500 ? '\n...' : '')
            );


            // -------------------------------------------------
            // 5. فحص LZString
            // -------------------------------------------------

            addStatus(
                'info',
                '4️⃣ فحص LZString',
                'typeof LZString = ' + typeof LZString
            );


            if (typeof LZString === 'undefined') {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 4',
                    'مكتبة LZString لم يتم تحميلها.'
                );

                return;
            }


            addStatus(
                'success',
                '✅ LZString موجودة',
                'المكتبة تم تحميلها بنجاح.'
            );


            // -------------------------------------------------
            // 6. فك الضغط
            // -------------------------------------------------

            let decoded;

            try {

                decoded =
                    LZString.decompressFromEncodedURIComponent(
                        encoded
                    );

            } catch (decodeError) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 5',
                    'حدث خطأ أثناء فك ضغط LZString:<br>' +
                    String(decodeError)
                );

                return;
            }


            if (!decoded) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 5',
                    'LZString موجودة، ولكنها لم تستطع فك البيانات.<br>' +
                    'هذا يعني أن البيانات التي تم ضغطها في script.js لا تتطابق مع طريقة فك الضغط هنا.'
                );

                return;
            }


            addStatus(
                'success',
                '✅ تم فك ضغط البيانات',
                'طول البيانات بعد فك الضغط = ' +
                decoded.length
            );


            addDataBox(
                'البيانات بعد فك الضغط:',
                decoded
            );


            // -------------------------------------------------
            // 7. JSON
            // -------------------------------------------------

            let data;

            try {

                data = JSON.parse(decoded);

            } catch (jsonError) {

                addStatus(
                    'error',
                    '❌ المشكلة رقم 6',
                    'فك الضغط نجح، لكن JSON غير صالح.<br><br>' +
                    String(jsonError)
                );

                return;
            }


            addStatus(
                'success',
                '✅ JSON صالح',
                'تم تحويل البيانات إلى كائن JavaScript بنجاح.'
            );


            // -------------------------------------------------
            // 8. عرض البيانات
            // -------------------------------------------------

            document.getElementById('student').textContent =
                data.student || '';

            document.getElementById('phone').textContent =
                data.phone || '';

            document.getElementById('grade').textContent =
                data.grade || '';

            document.getElementById('unit').textContent =
                data.unit || '';

            document.getElementById('lesson').textContent =
                data.lesson || '';

            document.getElementById('score').textContent =
                (data.score ?? 0) +
                ' من ' +
                (data.total ?? 0);

            document.getElementById('percent').textContent =
                (data.percent ?? 0) + '%';

            document.getElementById('time').textContent =
                data.time || '';

            document.getElementById('date').textContent =
                data.date || '';


            // -------------------------------------------------
            // 9. الأسئلة الخاطئة
            // -------------------------------------------------

            const wrongContainer =
                document.getElementById('wrongQuestions');


            if (
                Array.isArray(data.wrongQuestions) &&
                data.wrongQuestions.length > 0
            ) {

                let wrongHtml =
                    '<div class="report-card">' +
                    '<h3 style="color:#ef4444;">' +
                    '❌ الأخطاء: ' +
                    data.wrongQuestions.length +
                    '</h3>';


                data.wrongQuestions.forEach(
                    function (q, index) {

                        wrongHtml +=
                            '<div style="' +
                            'margin-top:15px;' +
                            'padding:15px;' +
                            'background:#fff;' +
                            'border-radius:10px;' +
                            'border-right:5px solid #ef4444;' +
                            '">' +

                            '<strong>سؤال ' +
                            (index + 1) +
                            '</strong><br><br>' +

                            '📝 ' +
                            escapeHtml(q.question) +
                            '<br><br>' +

                            '❌ إجابة الطالب: ' +
                            escapeHtml(q.studentAnswer) +
                            '<br><br>' +

                            '✅ الإجابة الصحيحة: ' +
                            escapeHtml(q.correctAnswer) +

                            '</div>';
                    }
                );


                wrongHtml += '</div>';

                wrongContainer.innerHTML =
                    wrongHtml;

            } else {

                wrongContainer.innerHTML =
                    '<div class="status success">' +
                    '🎉 لا توجد أخطاء.' +
                    '</div>';
            }


            // -------------------------------------------------
            // نجاح كامل
            // -------------------------------------------------

            document.getElementById('report').style.display =
                'block';


            addStatus(
                'success',
                '🎉 نجح الاختبار بالكامل',
                'تم قراءة التقرير وفك ضغطه وتحويله إلى JSON بنجاح.'
            );


        } catch (error) {

            addStatus(
                'error',
                '❌ خطأ غير متوقع',
                String(error)
            );

            console.error(
                'REPORT ERROR:',
                error
            );
        }
    }


    // =========================================================
    // حماية النصوص
    // =========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    // =========================================================
    // بدء التشخيص
    // =========================================================

    window.addEventListener(
        'DOMContentLoaded',
        function () {

            diagnoseReport();

        }
    );

</script>

</body>
</html>
