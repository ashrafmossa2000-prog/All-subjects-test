<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📋 تقرير الأخطاء - للمعلم</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- مكتبة LZString لفك ضغط بيانات التقرير -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;

        h1 {

        .info-card {

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px dashed #e0e0e0;

        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row span {
            color: #666;
            font-weight: 600;

        .info-row strong {
            color: #333;
            font-weight: 800;
            text-align: left;
            word-break: break-word;
        }

        .grade-badge {
            display: block;
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);

        }

        .send-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #25D366, #128C7E);

            border-radius: 15px;
            font-size: 1.2em;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            margin: 20px 0;

        }

        .send-btn:hover {
            transform: translateY(-3px);

        }

        .question-card {
            background: #fff;

        .question-number {

        .wrong {

            text-align: center;

        }

        .footer {

            font-size: 0.9em;
            line-height: 1.8;

        .loading {

            padding: 50px 20px;
            font-size: 1.2em;

            font-weight: 700;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .info-row {
                flex-direction: column;
                gap: 3px;
            }

            .info-row strong {

            }

            .send-btn {
                font-size: 1em;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="container">
        <div class="loading">
            ⏳ جاري تحميل التقرير...
        </div>
    </div>

    <script>

        // =========================================================
        // قراءة بيانات التقرير من الرابط
        // البيانات تم ضغطها في script.js بواسطة LZString
        // =========================================================

        function getReportData() {

            const hash = window.location.hash;

            if (!hash || !hash.includes('data=')) {
                console.error('لم يتم العثور على data داخل الرابط');
                return null;
            }

            try {

                // أخذ البيانات بعد data=
                const encoded = hash.substring(
                    hash.indexOf('data=') + 5
                );

                if (!encoded) {
                    console.error('بيانات التقرير فارغة');
                    return null;
                }

                // التأكد من وجود مكتبة LZString
                if (typeof LZString === 'undefined') {
                    console.error('مكتبة LZString غير موجودة');
                    return null;
                }

                // فك ضغط البيانات
                const decoded =
                    LZString.decompressFromEncodedURIComponent(encoded);

                if (!decoded) {
                    console.error('فشل فك ضغط بيانات التقرير');
                    return null;
                }

                // تحويل النص إلى JSON
                const data = JSON.parse(decoded);

                console.log(
                    '✅ تم تحميل بيانات التقرير بنجاح:',
                    data
                );

                return data;

            } catch (e) {

                console.error(
                    '❌ خطأ في قراءة بيانات التقرير:',
                    e
                );

                return null;
            }
        }


        // =========================================================
        // حماية النصوص عند عرضها داخل HTML
        // =========================================================

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        // =========================================================
        // عرض التقرير
        // =========================================================

        function renderReport(data) {

            const container =
                document.getElementById('container');

            if (!data) {

                container.innerHTML = `
                    <h1>❌ خطأ في التقرير</h1>

                    <div class="error-state">
                        لم يتم العثور على بيانات التقرير.<br>
                        قد يكون الرابط غير كامل أو تم قطعه أثناء الإرسال عبر واتساب.
                    </div>

                    <div class="footer">
                        👨‍🏫 إعداد: المهندس / أشرف موسى<br>
                        📞 01110547129 - 01100429783
                    </div>
                `;

                return;
            }


            // =====================================================
            // تحديد التقدير
            // =====================================================

            let gradeText = '';

            const percent = Number(data.percent) || 0;

            if (percent >= 90) {

                gradeText = '🌟 ممتاز';

            } else if (percent >= 75) {

                gradeText = '👍 جيد جداً';

            } else if (percent >= 50) {

                gradeText = '📚 جيد';

            } else {

                gradeText = '💪 يحتاج لمزيد من المذاكرة';
            }


            // =====================================================
            // البيانات الأساسية
            // =====================================================

            let html = `

                <h1>📋 تقرير اختبار الطالب</h1>

                <p class="subtitle">
                    👨‍🏫 للمعلم - المهندس / أشرف موسى
                </p>

                <div class="info-card">

                    <div class="info-row">
                        <span>👤 الطالب:</span>
                        <strong>
                            ${escapeHtml(data.student)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>📱 رقم الواتساب:</span>
                        <strong style="direction:ltr;">
                            ${escapeHtml(data.phone)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>📚 الصف:</span>
                        <strong>
                            ${escapeHtml(data.grade)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>📖 الوحدة:</span>
                        <strong>
                            ${escapeHtml(data.unit)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>📝 الدرس:</span>
                        <strong>
                            ${escapeHtml(data.lesson)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>🏆 الدرجة:</span>
                        <strong>
                            ${escapeHtml(data.score)}
                            من
                            ${escapeHtml(data.total)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>📈 النسبة:</span>
                        <strong>
                            ${escapeHtml(data.percent)}%
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>⏱️ الوقت المستغرق:</span>
                        <strong>
                            ${escapeHtml(data.time)}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>🕐 التاريخ:</span>
                        <strong>
                            ${escapeHtml(data.date)}
                        </strong>
                    </div>

                    <div class="grade-badge">
                        ${gradeText}
                    </div>

                </div>

                <button
                    class="send-btn"
                    onclick="sendToStudent()"
                >
                    📱 إرسال الأخطاء للطالب على واتساب
                </button>
            `;


            // =====================================================
            // عرض الأسئلة الخاطئة
            // =====================================================

            if (
                Array.isArray(data.wrongQuestions) &&
                data.wrongQuestions.length > 0
            ) {

                html += `

                    <h2 style="
                        color:#ef4444;
                        margin:25px 0 15px;
                        text-align:center;
                        font-weight:900;
                    ">
                        ❌ الأخطاء (${data.wrongQuestions.length})
                    </h2>
                `;


                data.wrongQuestions.forEach((q, i) => {

                    html += `

                        <div class="question-card">

                            <span class="question-number">
                                سؤال ${i + 1}
                            </span>

                            <div class="question-text">
                                ${escapeHtml(q.question)}
                            </div>

                            <div class="answer-box wrong">

                                <span class="answer-label">
                                    ❌ إجابة الطالب:
                                </span>

                                ${escapeHtml(q.studentAnswer)}

                            </div>

                            <div class="answer-box correct">

                                <span class="answer-label">
                                    ✅ الإجابة الصحيحة:
                                </span>

                                ${escapeHtml(q.correctAnswer)}

                            </div>

                        </div>
                    `;
                });

            } else {

                html += `

                    <div class="empty-state">
                        🎉 ممتاز! لا توجد أخطاء
                    </div>
                `;
            }


            // =====================================================
            // الفوتر
            // =====================================================

            html += `

                <div class="footer">

                    👨‍🏫 إعداد: المهندس / أشرف موسى<br>

                    📞 01110547129 - 01100429783

                </div>
            `;


            container.innerHTML = html;
        }


        // =========================================================
        // تنظيف رقم واتساب
        // =========================================================

        function normalizeWhatsAppNumber(phone) {

            let number = String(phone || '')
                .replace(/\D/g, '');

            // إزالة 00 من بداية الرقم
            if (number.startsWith('00')) {
                number = number.substring(2);
            }

            // رقم مصري محلي 01xxxxxxxxx
            if (
                number.startsWith('01') &&
                number.length === 11
            ) {
                number = '20' + number.substring(1);
            }

            return number;
        }


        // =========================================================
        // إرسال الأخطاء للطالب عبر واتساب
        // =========================================================

        function sendToStudent() {

            const data = getReportData();

            if (!data) {

                alert('❌ لا توجد بيانات للتقرير');

                return;
            }


            // رقم الطالب
            const phone =
                normalizeWhatsAppNumber(data.phone);


            if (!phone || phone.length < 10) {

                alert('❌ رقم واتساب الطالب غير صحيح');

                return;
            }


            // =====================================================
            // إنشاء الرسالة
            // =====================================================

            let message = `📋 تصحيح الأخطاء

📚 الصف: ${data.grade || ''}

📖 الوحدة: ${data.unit || ''}

📝 الدرس: ${data.lesson || ''}

👤 الطالب: ${data.student || ''}

🏆 الدرجة: ${data.score || 0} من ${data.total || 0}

📈 النسبة: ${data.percent || 0}%

⏱️ الوقت المستغرق: ${data.time || ''}

━━━━━━━━━━━━━━━━━━━

`;


            // =====================================================
            // إضافة الأخطاء
            // =====================================================

            if (
                Array.isArray(data.wrongQuestions) &&
                data.wrongQuestions.length > 0
            ) {

                message += `❌ الأخطاء وتصحيحها:\n\n`;

                data.wrongQuestions.forEach((q, i) => {

                    message += `سؤال ${i + 1}:\n`;

                    message += `📝 ${q.question || ''}\n\n`;

                    message += `❌ إجابتك: ${q.studentAnswer || ''}\n`;

                    message += `✅ الإجابة الصحيحة: ${q.correctAnswer || ''}\n\n`;

                    message += `━━━━━━━━━━━━━━━━━━━\n\n`;
                });

            } else {

                message += `🎉 ممتاز! لا توجد أخطاء\n\n`;
            }


            message += `🕐 التاريخ: ${data.date || ''}\n\n`;

            message += `👨‍🏫 إعداد: المهندس / أشرف موسى\n\n`;

            message += `📞 01110547129 - 01100429783`;


            // =====================================================
            // فتح واتساب
            // =====================================================

            const whatsappUrl =
                'https://wa.me/' +
                phone +
                '?text=' +
                encodeURIComponent(message);


            // فتح واتساب في نافذة جديدة
            window.open(
                whatsappUrl,
                '_blank'
            );
        }


        // =========================================================
        // تحميل التقرير عند فتح الصفحة
        // =========================================================

        window.addEventListener(
            'DOMContentLoaded',
            function () {

                const data = getReportData();

                renderReport(data);
            }
        );

    </script>

</body>

</html>
